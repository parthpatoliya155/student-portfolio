name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/task-manager-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './backend/task-manager-api/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Run Automated Tests
        run: npm test
