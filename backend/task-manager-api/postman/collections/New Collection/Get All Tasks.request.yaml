$kind: http-request
name: Get All Tasks
url: http://localhost:5000/tasks
method: GET
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Response is an array of tasks", () => {
          pm.expect(pm.response.json()).to.be.an("array");
      });
