$kind: http-request
name: Create Task - Empty Title
url: http://localhost:5000/tasks
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "   ",
      "completed": false
    }
order: 2500
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", () => {
          pm.response.to.have.status(400);
      });
      pm.test("Returns validation error message", () => {
          var data = pm.response.json();
          pm.expect(data.error).to.include("Task title is required");
      });
