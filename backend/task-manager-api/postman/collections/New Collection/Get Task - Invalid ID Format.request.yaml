$kind: http-request
name: Get Task - Invalid ID Format
url: http://localhost:5000/tasks/abc
method: GET
order: 3700
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", () => {
          pm.response.to.have.status(400);
      });
      pm.test("Returns invalid format error message", () => {
          var data = pm.response.json();
          pm.expect(data.error).to.include("Task ID must be a positive integer");
      });
