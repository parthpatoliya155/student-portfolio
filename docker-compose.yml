# Docker Compose Configuration
# Task Management Application — Full Stack Containerization
# Author: Parth Patoliya | Practical 11: Containerization with Docker and Docker Compose
#
# Services:
#   1. frontend  — React + Vite (served by Nginx) on port 3000
#   2. backend   — Node.js + Express API on port 5000
#   3. mongodb   — MongoDB database on port 27017

services:
  # ──── Service 1: MongoDB Database ───────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: taskdb-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=taskdb
    networks:
      - task-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──── Service 2: Backend API (Node.js + Express) ────────────────────────────
  backend:
    build:
      context: ./backend/task-manager-api
      dockerfile: Dockerfile
    container_name: taskmanager-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=docker_jwt_secret_key_2026
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - task-network
    restart: unless-stopped

  # ──── Service 3: Frontend (React + Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend/student-portfolio
      dockerfile: Dockerfile
    container_name: taskmanager-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - task-network
    restart: unless-stopped

# ──── Shared Network ──────────────────────────────────────────────────────────
networks:
  task-network:
    driver: bridge

# ──── Persistent Volume for MongoDB Data ──────────────────────────────────────
volumes:
  mongo-data:
    driver: local
